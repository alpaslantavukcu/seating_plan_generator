<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sınav Yerleşim Planı</title>
  <meta name="description" content="Derslik oturma planı oluşturucu — tarayıcıda çalışır, veri sunucuya gönderilmez.">
  <link rel="icon" type="image/svg+xml" href="assets/bee.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/print.css" media="print">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <img src="assets/bee.svg" alt="" class="brand-mark" width="34" height="34">
        <div>
          <h1 data-i18n="appTitle">Sınav Yerleşim Planı</h1>
          <p class="tagline" data-i18n="tagline">Derslik oturma planı oluşturucu</p>
        </div>
      </div>
      <button id="lang-toggle" class="lang-toggle" type="button" data-i18n="langLabel">EN</button>
    </div>
  </header>

  <main>
    <!-- ===================== SETUP ===================== -->
    <section id="setup" class="card">
      <h2 data-i18n="setupTitle">Plan Ayarları</h2>

      <div class="field">
        <label for="exam-name" data-i18n="examName">Sınav adı</label>
        <input id="exam-name" type="text" data-i18n-placeholder="examNamePh" autocomplete="off">
      </div>

      <fieldset class="field">
        <legend data-i18n="studentsTitle">Öğrenci Listesi</legend>
        <div class="tabs" role="tablist">
          <button type="button" class="tab active" data-input-tab="paste" data-i18n="pasteTab">Ninova’dan yapıştır</button>
          <button type="button" class="tab" data-input-tab="txt" data-i18n="fileTab">.txt dosyası</button>
          <button type="button" class="tab" data-input-tab="xlsx" data-i18n="excelTab">Excel / CSV</button>
        </div>
        <div class="tab-panel" data-input-panel="paste">
          <textarea id="paste-area" rows="6" spellcheck="false" data-i18n-placeholder="pastePh"></textarea>
        </div>
        <div class="tab-panel hidden" data-input-panel="txt">
          <label class="dropzone" id="txt-drop">
            <input type="file" id="txt-file" accept=".txt,text/plain" hidden>
            <span data-i18n="fileHint">Dosya seçin veya buraya bırakın</span>
          </label>
        </div>
        <div class="tab-panel hidden" data-input-panel="xlsx">
          <label class="dropzone" id="xlsx-drop">
            <input type="file" id="xlsx-file" accept=".xlsx,.csv,.tsv" hidden>
            <span data-i18n="fileHint">Dosya seçin veya buraya bırakın</span>
          </label>
          <p class="hint" data-i18n="xlsxColsHint"></p>
        </div>
        <p id="student-status" class="status muted" data-i18n="noStudents">Henüz öğrenci listesi yüklenmedi</p>
      </fieldset>

      <fieldset class="field">
        <legend data-i18n="roomsTitle">Derslikler</legend>
        <p class="hint" data-i18n="roomsHint"></p>
        <div id="room-picker" class="room-picker"></div>
        <label class="check">
          <input type="checkbox" id="custom-cap">
          <span data-i18n="customCap">Dersliklere özel kontenjan kullan</span>
        </label>
        <div id="cap-editor" class="cap-editor hidden"></div>
        <p id="capacity-summary" class="status muted"></p>
      </fieldset>

      <fieldset class="field options-row">
        <legend data-i18n="optionsTitle">Seçenekler</legend>
        <div class="option-col">
          <label for="seed" data-i18n="seed">Rastgelelik tohumu</label>
          <input id="seed" type="text" inputmode="numeric" pattern="[0-9]*" data-i18n-placeholder="seedPh">
          <p class="hint" data-i18n="seedHint"></p>
        </div>
        <div class="option-col">
          <span class="label-like" data-i18n="cellFields">Koltuk kutusunda gösterilecekler</span>
          <label class="check"><input type="checkbox" id="field-id" checked><span data-i18n="fieldId">Öğrenci No</span></label>
          <label class="check"><input type="checkbox" id="field-name" checked><span data-i18n="fieldName">Ad Soyad</span></label>
          <label class="check"><input type="checkbox" id="field-seat"><span data-i18n="fieldSeat">Sıra No</span></label>
        </div>
      </fieldset>

      <button id="generate" class="btn-primary" type="button" data-i18n="generate">Yerleşim Planı Oluştur</button>
      <p id="setup-error" class="status error hidden"></p>
    </section>

    <!-- ===================== PLAN ===================== -->
    <section id="plan" class="card hidden">
      <div class="plan-header">
        <h2 data-i18n="planTitle">Yerleşim Planı</h2>
        <p id="seed-info" class="status muted"></p>
      </div>

      <div class="plan-toolbar">
        <div id="room-tabs" class="tabs" role="tablist"></div>
        <div class="toolbar-right">
          <div class="toggle-group" id="live-toggles">
            <label class="check"><input type="checkbox" id="live-id" checked><span data-i18n="fieldId">Öğrenci No</span></label>
            <label class="check"><input type="checkbox" id="live-name" checked><span data-i18n="fieldName">Ad Soyad</span></label>
            <label class="check"><input type="checkbox" id="live-seat"><span data-i18n="fieldSeat">Sıra No</span></label>
          </div>
          <button id="regenerate" class="btn-secondary" type="button" data-i18n="regenerate">Yeniden Karıştır</button>
        </div>
      </div>

      <p id="room-meta" class="status muted"></p>
      <div id="grid-wrap" class="grid-wrap"></div>
      <p class="hint" data-i18n="dragHint"></p>

      <div class="exports">
        <h3 data-i18n="exportsTitle">İndir</h3>
        <div class="export-buttons">
          <div class="export-group">
            <span class="export-kind">PDF</span>
            <button type="button" class="btn-export" id="exp-pdf-room" data-i18n="pdfRoom"></button>
            <button type="button" class="btn-export" id="exp-pdf-all-id" data-i18n="pdfAllId"></button>
            <button type="button" class="btn-export" id="exp-pdf-all-full" data-i18n="pdfAllFull"></button>
            <button type="button" class="btn-export" id="exp-pdf-roomlist" data-i18n="pdfRoomList"></button>
          </div>
          <div class="export-group">
            <span class="export-kind">Excel</span>
            <button type="button" class="btn-export" id="exp-xlsx-room" data-i18n="xlsxRoom"></button>
            <button type="button" class="btn-export" id="exp-xlsx-all" data-i18n="xlsxAll"></button>
            <button type="button" class="btn-export" id="exp-xlsx-roomlist" data-i18n="xlsxRoomList"></button>
          </div>
          <div class="export-group">
            <span class="export-kind">&nbsp;</span>
            <button type="button" class="btn-export" id="exp-print" data-i18n="printPage"></button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p data-i18n="footerNote"></p>
  </footer>

  <div id="toast" class="toast hidden"></div>

  <script src="vendor/jspdf.umd.min.js" defer></script>
  <script src="vendor/exceljs.min.js" defer></script>
  <script src="vendor/fonts/NotoSans-normal.js" defer></script>
  <script src="vendor/fonts/NotoSans-bold.js" defer></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
